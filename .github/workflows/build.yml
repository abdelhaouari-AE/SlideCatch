# Build server (GitHub Actions). At every push:
#   1. checks and tests on Linux (quick, no screen needed);
#   2. on Windows: tests with real windows and captures, builds the portable
#      folder, runs the built program's self-test, reports the size, and keeps
#      the zip as a download ("artifact") of the run.
# When the version in slidecatch/__init__.py is new, the zip is also published
# as a GitHub release "v<version>".

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed only to publish a release

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux-tests:
    name: Checks and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Libraries Qt needs on Linux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Tests, build and self-test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Tests (real windows and captures)
        run: python -m pytest -rs

      - name: Build the portable folder
        run: python -m PyInstaller SlideCatch.spec --noconfirm --clean --log-level WARN

      - name: Self-test of the built program
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.json"
          Get-ChildItem dist\SlideCatch\_internal\PySide6 -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }
          $p = Start-Process -FilePath "dist\SlideCatch\SlideCatch.exe" -ArgumentList "--self-test", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(240000)) {
            # Still running after 4 minutes: photograph the screen (a message box?) and stop it
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD "selftest-hang.png"))
            Stop-Process -Id $p.Id -Force
            Get-Content $report -ErrorAction SilentlyContinue
            throw "The self-test did not finish within 4 minutes (see selftest-hang.png)"
          }
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Diagnose a failed self-test (console build)
        if: failure()
        shell: pwsh
        env:
          SLIDECATCH_CONSOLE: "1"
          QT_DEBUG_PLUGINS: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m PyInstaller SlideCatch.spec --noconfirm --distpath distc --workpath buildc --log-level WARN
          $out = Join-Path $PWD "console.txt"
          $p = Start-Process -FilePath "distc\SlideCatch\SlideCatch.exe" -ArgumentList "--self-test", "selftest-console.json" -RedirectStandardOutput $out -RedirectStandardError "$out.err" -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; "TIMEOUT" }
          Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-Content "$out.err" -ErrorAction SilentlyContinue | Select-Object -Last 80
          Get-Content selftest-console.json -ErrorAction SilentlyContinue

      - name: Zip and size report
        id: package
        shell: pwsh
        run: |
          $version = python -c "import slidecatch; print(slidecatch.APP_VERSION)"
          $zip = "SlideCatch-$version-portable.zip"
          Compress-Archive -Path dist\SlideCatch -DestinationPath $zip -Force
          $files = Get-ChildItem dist\SlideCatch -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          $zipSize = (Get-Item $zip).Length
          $lines = @("## SlideCatch $version - size",
                     "",
                     "| | MB |", "|---|---:|",
                     ("| Folder (unpacked) | {0:N1} |" -f ($total / 1MB)),
                     ("| Zip (download) | {0:N1} |" -f ($zipSize / 1MB)),
                     "", "Biggest files:", "",
                     "| File | MB |", "|---|---:|")
          $files | Sort-Object Length -Descending | Select-Object -First 12 | ForEach-Object {
            $lines += ("| {0} | {1:N2} |" -f $_.FullName.Substring((Resolve-Path dist\SlideCatch).Path.Length + 1), ($_.Length / 1MB))
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | Write-Output
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Screenshots of every screen
        if: always()
        continue-on-error: true
        run: |
          python scripts/screenshots.py shots en light
          python scripts/screenshots.py shots ar light
          python scripts/screenshots.py shots fr dark
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        with:
          name: SlideCatch-portable
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            selftest.json
            selftest-hang.png
            shots/
          if-no-files-found: ignore

      - name: Publish the release (new version on main only)
        # When APP_VERSION has changed, the first green build of main publishes
        # "v<version>" with the zip. Nothing happens if that release exists.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import slidecatch; print(slidecatch.APP_VERSION)"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { "Release v$version already exists - nothing to publish."; exit 0 }
          # notes = this version's section of CHANGELOG.md
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\b.*?(?=^## |\z)")
          $m.Value | Out-File notes.md -Encoding utf8
          gh release create "v$version" "${{ steps.package.outputs.zip }}" --target "${{ github.sha }}" --title "SlideCatch $version" --notes-file notes.md
